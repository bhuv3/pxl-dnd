     URL options: ?stages=water,tint  ?maps=/samples/maps/grand-arena.json,...  ?times=3.7,10  ?hours=2,23  ?set={"weather":"rain"}  ?full=0  ?audit=1 (the everything map; add &raised=0 or 1, &seasons=winter)

<script src="audit.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search), list = k => q.get(k) ? q.get(k).split(',') : undefined;
  window.__glResult = { done: false };
  try {
    const options = { maps: list('maps'), names: list('stages'), times: list('times') && list('times').map(Number), hours: list('hours') && list('hours').map(Number), full: q.get('full') !== '0', settings: q.get('set') ? JSON.parse(q.get('set')) : undefined };
    const result = q.get('audit') ? await GlAudit.run({ raised: q.get('raised') ? q.get('raised').split(',').map(v => v === '1') : undefined, seasons: list('seasons'), hours: options.hours }) : await GlParity.suite(options);
    window.__glResult = { done: true, supported: Gl.supported(), ...result };
  } catch (e) {
    window.__glResult = { done: true, rows: [], errors: [{ error: String(e && e.stack || e) }] };
  }
  document.getElementById('out').textContent = JSON.stringify(window.__glResult, null, 1);
})();
</script>
