<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adventure editor</title>
  <link rel="stylesheet" href="css/fight.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <main class="fight">
    <div class="stage">
      <canvas id="stage"></canvas>
      <div class="toolbar" id="tools"></div>
      <p class="status" id="status"></p>
    </div>
    <aside class="side editor">
      <div class="file">
        <button id="new">New</button>
        <button id="open">Open file…</button>
        <select id="known"></select>
        <button id="export" class="end">Export</button>
        <input type="file" id="openFile" accept=".js" hidden>
        <input type="file" id="mapFile" accept=".json" hidden>
      </div>
      <div class="play"><button id="playStart">▶ Play from start</button><button id="playMap">▶ Play this map</button></div>
      <div class="scroll">
        <details open><summary>Adventure</summary><div id="adventure"></div></details>
        <details open><summary>Maps</summary><div id="maps"></div></details>
        <details open><summary>Selected</summary><div id="selected"></div></details>
        <details><summary>Groups on this map</summary><div id="groups"></div></details>
        <details open><summary>Problems</summary><ul class="problems" id="problems"></ul></details>
      </div>
    </aside>
  </main>

  <!-- Map editor modules (drawing only: no editor UI, no autosave). -->
  <script src="../map-editor/js/core/random.js"></script>
  <script src="../map-editor/js/core/grid.js"></script>
  <script src="../map-editor/js/core/colors.js"></script>

  <script src="../map-editor/js/render/characterArt.js"></script>
  <script src="../map-editor/js/render/villagers.js"></script>
  <script src="../map-editor/js/render/monsters.js"></script>
  <script src="../map-editor/js/render/props.js"></script>
  <script src="../map-editor/js/render/houseKit.js"></script>
  <script src="../map-editor/js/render/houses.js"></script>
  <script src="../map-editor/js/render/landmarks.js"></script>
  <script src="../map-editor/js/render/structures.js"></script>
  <script src="../map-editor/js/render/sprites.js"></script>
  <script src="../map-editor/js/render/details.js"></script>

  <script src="../map-editor/js/render/actors.js"></script>
  <script src="../map-editor/js/render/animals.js"></script>
  <script src="../map-editor/js/render/tracks.js"></script>
  <script src="../map-editor/js/render/doors.js"></script>

  <script src="../map-editor/js/gl/context.js"></script>
